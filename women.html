<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>women - LUXE</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <div class="container">
                <div class="nav-content">
                    <div class="logo">
                        <a href="index.html"><h1>LUXE</h1></a>
                    </div>
                    <ul class="nav-links">
                        <li><a href="index.html#home" class="nav-link">Home</a></li>
                        <li><a href="index.html#shop" class="nav-link active">Shop</a></li>
                        <li><a href="index.html#collections" class="nav-link">Collections</a></li>
                        <li><a href="index.html#about" class="nav-link">About</a></li>
                        <li><a href="index.html#contact" class="nav-link">Contact</a></li>
                    </ul>
                    <div class="nav-icons">
                        <a href="wishlist.html" class="icon-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><span class="badge" id="wishlistCount">0</span></a>
                        <a href="checkout.html" class="icon-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg><span class="badge" id="cartCount">0</span></a>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    
    <section style="padding: 150px 0 100px;">
        <div class="container">
            <h1 class="section-title" style="text-align: center; margin-bottom: 60px;">women Collection</h1>
            <div class="categories-grid">
                <div class="category-card" style="pointer-events: none;">
                    <div class="category-image"><div style="width: 100%; height: 350px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);"></div></div>
                    <div class="category-info"><h3>Coming Soon</h3><p>Explore our collection</p></div>
                </div>
            </div>
        </div>
    </section>
    
    <div class="toast" id="toast"></div>
    <script>
        document.title = 'women'.charAt(0).toUpperCase() + 'women'.slice(1) + ' - LUXE';
        document.querySelector('.section-title').textContent = 'women'.charAt(0).toUpperCase() + 'women'.slice(1) + ' Collection';
        const wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        document.getElementById('wishlistCount').textContent = wishlist.length;
        document.getElementById('cartCount').textContent = cart.reduce((t, i) => t + i.quantity, 0);
    </script>
</body>
</html>
