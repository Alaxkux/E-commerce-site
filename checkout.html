<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - LUXE</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        .cart-item {
            display: grid;
            grid-template-columns: 100px 1fr auto;
            gap: 20px;
            padding: 20px;
            background: white;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
        }
        .cart-item-image {
            width: 100px;
            height: 100px;
            border-radius: 10px;
            overflow: hidden;
        }
        .cart-item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .cart-item-info h4 {
            margin-bottom: 5px;
        }
        .cart-item-info p {
            color: var(--text-light);
            font-size: 14px;
        }
        .cart-item-actions {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: space-between;
        }
        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .quantity-btn {
            width: 30px;
            height: 30px;
            border: 2px solid var(--primary-color);
            background: white;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--primary-color);
        }
        .quantity-btn:hover {
            background: var(--primary-color);
            color: white;
        }
        .remove-btn {
            background: none;
            border: none;
            color: var(--secondary-color);
            cursor: pointer;
            font-size: 14px;
        }
        .cart-summary {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: var(--shadow-md);
            position: sticky;
            top: 100px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--bg-light);
        }
        .summary-row.total {
            border-bottom: none;
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <div class="container">
                <div class="nav-content">
                    <div class="logo">
                        <a href="index.html"><h1>LUXE</h1></a>
                    </div>
                    <ul class="nav-links">
                        <li><a href="index.html#home" class="nav-link">Home</a></li>
                        <li><a href="index.html#shop" class="nav-link">Shop</a></li>
                        <li><a href="index.html#collections" class="nav-link">Collections</a></li>
                        <li><a href="index.html#about" class="nav-link">About</a></li>
                        <li><a href="index.html#contact" class="nav-link">Contact</a></li>
                    </ul>
                    <div class="nav-icons">
                        <a href="wishlist.html" class="icon-btn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                            </svg>
                            <span class="badge" id="wishlistCount">0</span>
                        </a>
                        <a href="checkout.html" class="icon-btn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="9" cy="21" r="1"></circle>
                                <circle cx="20" cy="21" r="1"></circle>
                                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                            </svg>
                            <span class="badge" id="cartCount">0</span>
                        </a>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    
    <section style="padding: 150px 0 100px; min-height: 70vh; background: var(--bg-light);">
        <div class="container">
            <h1 class="section-title" style="text-align: center; margin-bottom: 60px;">Shopping Cart</h1>
            <div class="checkout-container" style="display: grid; grid-template-columns: 2fr 1fr; gap: 40px;">
                <div id="cartContainer"></div>
                <div>
                    <div class="cart-summary">
                        <h3 style="margin-bottom: 25px;">Order Summary</h3>
                        <div class="summary-row">
                            <span>Subtotal:</span>
                            <span id="subtotal">$0.00</span>
                        </div>
                        <div class="summary-row">
                            <span>Shipping:</span>
                            <span>Free</span>
                        </div>
                        <div class="summary-row">
                            <span>Tax:</span>
                            <span id="tax">$0.00</span>
                        </div>
                        <div class="summary-row total">
                            <span>Total:</span>
                            <span id="total">$0.00</span>
                        </div>
                        <button class="btn btn-primary btn-block" style="margin-top: 20px;" onclick="checkout()">Proceed to Checkout</button>
                    </div>
                </div>
            </div>
        </div>
    </section>
    
    <div class="toast" id="toast"></div>
    
    <script>
        function updateBadges() {
            const wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            document.getElementById('wishlistCount').textContent = wishlist.length;
            document.getElementById('cartCount').textContent = cart.reduce((t, i) => t + i.quantity, 0);
        }
        
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
        
        function renderCart() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const container = document.getElementById('cartContainer');
            
            if (cart.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 60px 0; background: white; border-radius: 20px;"><h3 style="color: var(--text-light); margin-bottom: 20px;">Your cart is empty</h3><a href="index.html#shop" class="btn btn-primary">Continue Shopping</a></div>';
                updateSummary();
                return;
            }
            
            container.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div class="cart-item-image">
                        <img src="${item.image}" alt="${item.name}">
                    </div>
                    <div class="cart-item-info">
                        <h4>${item.name}</h4>
                        <p>${item.category}</p>
                        <p style="color: var(--primary-color); font-weight: 600; font-size: 18px; margin-top: 10px;">$${item.price}</p>
                    </div>
                    <div class="cart-item-actions">
                        <div class="quantity-controls">
                            <button class="quantity-btn" onclick="updateQuantity(${item.id}, -1)">−</button>
                            <span style="min-width: 30px; text-align: center; font-weight: 600;">${item.quantity}</span>
                            <button class="quantity-btn" onclick="updateQuantity(${item.id}, 1)">+</button>
                        </div>
                        <button class="remove-btn" onclick="removeFromCart(${item.id})">Remove</button>
                    </div>
                </div>
            `).join('');
            
            updateSummary();
        }
        
        function updateQuantity(id, change) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const item = cart.find(i => i.id === id);
            
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
                localStorage.setItem('cart', JSON.stringify(cart));
                updateBadges();
                renderCart();
            }
        }
        
        function removeFromCart(id) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart = cart.filter(item => item.id !== id);
            localStorage.setItem('cart', JSON.stringify(cart));
            updateBadges();
            renderCart();
            showToast('Removed from cart');
        }
        
        function updateSummary() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const tax = subtotal * 0.08;
            const total = subtotal + tax;
            
            document.getElementById('subtotal').textContent = '$' + subtotal.toFixed(2);
            document.getElementById('tax').textContent = '$' + tax.toFixed(2);
            document.getElementById('total').textContent = '$' + total.toFixed(2);
        }
        
        function checkout() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            if (cart.length === 0) {
                showToast('Your cart is empty', 'error');
                return;
            }
            showToast('Proceeding to checkout...', 'success');
            setTimeout(() => {
                showToast('Order placed successfully!', 'success');
                localStorage.setItem('cart', JSON.stringify([]));
                updateBadges();
                renderCart();
            }, 2000);
        }
        
        updateBadges();
        renderCart();
    </script>
</body>
</html>
