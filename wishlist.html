<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - LUXE</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <div class="container">
                <div class="nav-content">
                    <div class="logo">
                        <a href="index.html"><h1>LUXE</h1></a>
                    </div>
                    <ul class="nav-links">
                        <li><a href="index.html#home" class="nav-link">Home</a></li>
                        <li><a href="index.html#shop" class="nav-link">Shop</a></li>
                        <li><a href="index.html#collections" class="nav-link">Collections</a></li>
                        <li><a href="index.html#about" class="nav-link">About</a></li>
                        <li><a href="index.html#contact" class="nav-link">Contact</a></li>
                    </ul>
                    <div class="nav-icons">
                        <a href="wishlist.html" class="icon-btn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                            </svg>
                            <span class="badge" id="wishlistCount">0</span>
                        </a>
                        <a href="checkout.html" class="icon-btn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="9" cy="21" r="1"></circle>
                                <circle cx="20" cy="21" r="1"></circle>
                                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                            </svg>
                            <span class="badge" id="cartCount">0</span>
                        </a>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    
    <section style="padding: 150px 0 100px; min-height: 70vh;">
        <div class="container">
            <h1 class="section-title" style="text-align: center; margin-bottom: 60px;">My Wishlist</h1>
            <div id="wishlistContainer"></div>
        </div>
    </section>
    
    <div class="toast" id="toast"></div>
    
    <script>
        function updateBadges() {
            const wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            document.getElementById('wishlistCount').textContent = wishlist.length;
            document.getElementById('cartCount').textContent = cart.reduce((t, i) => t + i.quantity, 0);
        }
        
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
        
        function renderWishlist() {
            const wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
            const container = document.getElementById('wishlistContainer');
            
            if (wishlist.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 60px 0;"><h3 style="color: var(--text-light); margin-bottom: 20px;">Your wishlist is empty</h3><a href="index.html#shop" class="btn btn-primary">Continue Shopping</a></div>';
                return;
            }
            
            container.innerHTML = '<div class="categories-grid">' + wishlist.map(product => {
                const stars = '★'.repeat(product.rating) + '☆'.repeat(5 - product.rating);
                return `
                    <div class="product-card">
                        <div class="product-image">
                            <img src="${product.image}" alt="${product.name}">
                            <button class="wishlist-icon liked" onclick="removeFromWishlist(${product.id})">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2">
                                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                                </svg>
                            </button>
                        </div>
                        <div class="product-info">
                            <div class="product-rating">
                                <span class="stars">${stars}</span>
                                <span class="rating-count">(${product.reviews})</span>
                            </div>
                            <h3 class="product-name">${product.name}</h3>
                            <p class="product-category">${product.category}</p>
                            <div class="product-price">
                                <span class="price-current">$${product.price}</span>
                            </div>
                            <button class="btn btn-primary btn-block" onclick="addToCart(${product.id})">Add to Cart</button>
                        </div>
                    </div>
                `;
            }).join('') + '</div>';
        }
        
        function removeFromWishlist(id) {
            let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
            wishlist = wishlist.filter(item => item.id !== id);
            localStorage.setItem('wishlist', JSON.stringify(wishlist));
            updateBadges();
            renderWishlist();
            showToast('Removed from wishlist');
        }
        
        function addToCart(id) {
            const wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
            const product = wishlist.find(p => p.id === id);
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            
            const existingItem = cart.find(item => item.id === id);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            
            localStorage.setItem('cart', JSON.stringify(cart));
            updateBadges();
            showToast('Added to cart', 'success');
        }
        
        updateBadges();
        renderWishlist();
    </script>
</body>
</html>
